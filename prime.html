      if (topTier && nextTier)    return `Palier actuel${where} : <strong>${topTier.emoji} ${esc(topTier.name)}</strong> · prime <strong>${fmtEur(topTier.prime)}</strong>. Plus que <strong>${fmtEur(nextTier.seuil - teamHT)}</strong> pour débloquer ${nextTier.emoji} ${esc(nextTier.name)} (${fmtEur(nextTier.prime)}).`;

      return `Trimestre en cours${where}. La prime d'équipe repart de 0 chaque trimestre.`;

    // ── Tiers ─────────────────────────────────────────────────────────────────
    function topTierFor(ht) { return TIERS.filter(t => ht >= t.seuil).slice(-1)[0] || null; }

    function renderQuarterTabs(quartersByKey, activeKey, currentKey) {
      return `<div class="q-tabs" role="tablist">` + QUARTERS.map(q => {
        const data = quartersByKey[q.key] || { ht: 0, deals: 0 };
        const top = topTierFor(data.ht);
        const isActive = q.key === activeKey;
        const isFuture = q.key > currentKey;
        const state = top
          ? `${top.emoji} ${top.name}`
          : (isFuture ? "À venir" : (data.ht > 0 ? "Aucun palier" : "0 €"));
        const cls = [
          "q-tab",
          isActive ? "current" : "",
          top ? "unlocked" : "locked",
          isFuture ? "future" : "",
        ].filter(Boolean).join(" ");
        return `<button type="button" class="${cls}" role="tab" aria-selected="${isActive}" data-quarter="${q.key}">
          <span>${q.label}</span>
          <span class="q-range">${esc(q.range)}</span>
          <span class="q-state">${state}</span>
        </button>`;
      }).join("") + `</div>`;
    }

    function renderTiers(quartersByKey, activeKey) {
      const currentKey = currentQuarterKey();
      const active = quartersByKey[activeKey] || quartersByKey[currentKey] || { ht: 0, deals: 0, label: "Q" + activeKey, range: "" };
      const teamHT = active.ht;
      const unlocked = TIERS.filter(t => teamHT >= t.seuil);
      const topTier  = unlocked[unlocked.length - 1] || null;
      const nextTier = TIERS.find(t => teamHT < t.seuil) || null;

      const progressMax = 200000;
      const progressPct = Math.min(100, (teamHT / progressMax) * 100);

      const notches = TIERS.map(t => {
        const pct = (t.seuil / progressMax) * 100;
        return `<div class="tier-notch" style="left:${pct}%"><div class="tier-notch-lbl">${t.seuil/1000}k</div></div>`;
      }).join("");

      const tiersHtml = TIERS.map(t => {
        const done = teamHT >= t.seuil;
        const isCurrent = done && topTier?.key === t.key;
        const isNext = !done && nextTier?.key === t.key;
        const detail = isCurrent
          ? "Prime du trimestre"
          : (done ? "Palier atteint" : (isNext ? `Reste ${fmtEur(t.seuil - teamHT)}` : "À débloquer"));
        const stateLabel = done ? (isCurrent ? "✓ Actuel" : "✓ Atteint") : "✓ Atteint";
        return `<div class="tier ${t.key} ${done ? "unlocked" : "locked"} ${isCurrent ? "current" : ""} ${isNext ? "next" : ""}">
          <span class="tier-state ${done ? "unlocked" : "locked"}"${done ? "" : ' aria-hidden="true"'}>${stateLabel}</span>
          <span class="emoji">${t.emoji}</span>
          <div class="name">${esc(t.name)}</div>
          <div class="seuil">&gt; ${t.seuil/1000}k€ HT</div>
          <div class="prime">${fmtEur(t.prime)}</div>
          <div class="tier-detail">${esc(detail)}</div>
        </div>`;
      }).join("");

      const quarterLabel = `${active.label} · ${active.range}`;

      return {
        html: `
          ${renderQuarterTabs(quartersByKey, activeKey, currentKey)}
          <div class="tier-track-wrap" style="margin-top:14px">
            <div class="tier-track">
              <div class="tier-fill" data-w="${progressPct.toFixed(2)}">
                ${topTier ? `<div class="head-bubble">${topTier.emoji}</div>` : ""}
              </div>
              ${notches}
            </div>
          </div>
          <div class="tiers">${tiersHtml}</div>
          <div class="tier-sub">
            <span>${topTier
              ? `Prime ${esc(quarterLabel)} : <strong>${topTier.emoji} ${esc(topTier.name)}</strong> · <strong>${fmtEur(topTier.prime)}</strong>`
              : `Aucun palier sur ${esc(quarterLabel)}`}
            </span>
            <span>${nextTier
              ? `Prochaine prime : ${nextTier.emoji} ${esc(nextTier.name)} · <strong>${fmtEur(nextTier.seuil - teamHT)}</strong> restants → ${fmtEur(nextTier.prime)}`
              : `💎 Palier max atteint`}
            </span>
          </div>
          <div class="team-msg">
            <div class="team-text">${teamMessage(teamHT, topTier, nextTier, quarterLabel)}</div>
          </div>
        `,
        unlockedCount: unlocked.length,
        topTier, nextTier, active, quarterLabel,
      };
    }

          ${renderPrimeAiCard(config)}

          <div class="footer">
            Calculé en direct depuis HubSpot · RDV = meetings créés par Lucas non annulés, regroupés par mois de création · Transactions = deals rattachés aux comptes ou contacts de ces meetings · Prévisionnel = deals encore ouverts rattachés à ces meetings · Prime d'équipe = tous les closedwon HubSpot, cumulés par trimestre en HT (remise à zéro chaque trimestre) · Information interne, sans valeur contractuelle.

      `;

      document.querySelectorAll("[data-countup]").forEach(el => {
        const v = parseFloat(el.getAttribute("data-countup"));

      PRIME_AI_CONTEXT = buildAiContext(config, stats, projection, teamContext, rawData);

      bindTeamSwitcher();
      bindQuarterTabs("#team-prime-card", quartersByKey, (newKey) => {
        rerenderTeamPrime(newKey, quartersByKey, config);
      });
    }

    // ══════════════ SETTERS (alternants BDR) ══════════════
    // Tout se lit en Europe/Paris : un R1 compte dans le mois et la semaine où le setter
    // l'a posé (createdAt = hs_createdate), pas dans ceux où la réunion a lieu.

    // ── Dates Europe/Paris ────────────────────────────────────────────────────
    const PARIS_DAY_PARTS = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit" });
    const FMT_DAY_LABEL   = new Intl.DateTimeFormat("fr-FR", { timeZone: "UTC", weekday: "short", day: "numeric" });
    const FMT_DAY_MONTH   = new Intl.DateTimeFormat("fr-FR", { timeZone: "UTC", day: "numeric", month: "short" });
    const FMT_PARIS_DATE  = new Intl.DateTimeFormat("fr-FR", { timeZone: "Europe/Paris", day: "numeric", month: "short" });
    const FMT_PARIS_SLOT  = new Intl.DateTimeFormat("fr-FR", { timeZone: "Europe/Paris", weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    const FMT_MONTH_LONG  = new Intl.DateTimeFormat("fr-FR", { timeZone: "UTC", month: "long", year: "numeric" });

    function toDate(value) {
      if (value == null || value === "") return null;
      // HubSpot renvoie parfois des timestamps en ms sous forme de chaîne.
      const raw = typeof value === "string" && /^\d+$/.test(value) ? Number(value) : value;
      const d = new Date(raw);
      return Number.isNaN(d.getTime()) ? null : d;
    }
    function parisDayKey(value) {
      const d = toDate(value);
      if (!d) return "";
      const p = Object.fromEntries(PARIS_DAY_PARTS.formatToParts(d).map(x => [x.type, x.value]));
      return `${p.year}-${p.month}-${p.day}`;
    }
    const parisMonthKey = (value) => parisDayKey(value).slice(0, 7);
    // Les clés jour "YYYY-MM-DD" se manipulent en UTC pur (pas de changement d'heure).
    const dayKeyUtc  = (key) => { const [y, m, d] = String(key).split("-").map(Number); return Date.UTC(y, m - 1, d); };
    const addDaysKey = (key, n) => new Date(dayKeyUtc(key) + n * 86400000).toISOString().slice(0, 10);
    const weekdayOf  = (key) => new Date(dayKeyUtc(key)).getUTCDay(); // 0 = dimanche
    const mondayKey  = (key) => addDaysKey(key, -((weekdayOf(key) + 6) % 7));
    const fmtDayKey  = (key, fmt = FMT_DAY_MONTH) => key ? fmt.format(new Date(dayKeyUtc(key))) : "–";
    const fmtParisDate = (value) => { const d = toDate(value); return d ? FMT_PARIS_DATE.format(d) : "–"; };
    const fmtParisSlot = (value) => { const d = toDate(value); return d ? FMT_PARIS_SLOT.format(d) : "date inconnue"; };
    const timeOf = (value) => toDate(value)?.getTime() ?? 0;
    function monthLabelLong(key) {
      const [y, m] = String(key).split("-").map(Number);
      return y && m ? FMT_MONTH_LONG.format(new Date(Date.UTC(y, m - 1, 15))) : String(key);
    }
    const monthLabelShort = (key) => MOIS[key] || monthLabelLong(key);
    const capFirst = (s) => String(s || "").charAt(0).toUpperCase() + String(s || "").slice(1);
    function workdaysBetween(startKey, endKey) {
      let n = 0;
      for (let k = startKey; k <= endKey; k = addDaysKey(k, 1)) {
        const d = weekdayOf(k);
        if (d !== 0 && d !== 6) n++;
      }
      return n;
    }
    function lastDayOfMonthKey(key) {
      const [y, m] = String(key).split("-").map(Number);
      return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
    }

    // ── Formats ───────────────────────────────────────────────────────────────
    // Les primes setter tombent sur des centimes (37,50 €, 3 % du HT) : on les garde.
    const fmtPrime = (n) => {
      if (n == null) return "–";
      const v = Math.round(Number(n) * 100) / 100;
      return v.toLocaleString("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits: 2 });
    };
    // Une décimale : 30,4 % ne doit pas s'afficher « 30 % » alors qu'il dépasse le seuil.
    const fmtPct = (ratio) => ratio == null ? "–" : Number(ratio).toLocaleString("fr-FR", { style: "percent", maximumFractionDigits: 1 });
    const sumBy  = (list, fn) => list.reduce((s, x) => s + (Number(fn(x)) || 0), 0);
    const plural = (n, one, many) => `${fmtNum(n)} ${n > 1 ? many : one}`;

    const SETTER_TIER_STYLE = [
      { key: "bronze",  emoji: "🥉" },
      { key: "silver",  emoji: "🥈" },
      { key: "gold",    emoji: "🥇" },
      { key: "platine", emoji: "💎" },
    ];
    // inRate : le statut entre dans le taux de no-show (dénominateur).
    const SETTER_STATUS = {
      done:        { label: "Effectués",    inRate: true  },
      noShow:      { label: "No-show",      inRate: true  },
      canceled:    { label: "Annulés",      inRate: true  },
      rescheduled: { label: "Décalés",      inRate: false },
      pending:     { label: "À renseigner", inRate: false },
      upcoming:    { label: "À venir",      inRate: false },
    };
    const SETTER_GAUGE_MAX_PCT = 130; // la jauge RDV va jusqu'à 130 % pour laisser voir le palier 120 %

    function closerName(id) {
      const key = String(id || "");
      if (!key) return "closer non renseigné";
      return CONFIG[key]?.name || `owner ${key}`;
    }

    function dedupeById(list) {
      const seen = new Set();
      return (Array.isArray(list) ? list : []).filter(item => {
        const id = String(item?.id ?? "");
        if (!id) return true;
        if (seen.has(id)) return false;
        seen.add(id);
        return true;
      });
    }

    const isCanceledOutcome = (outcome) => ["CANCELED", "CANCELLED"].includes(String(outcome || "").trim().toUpperCase());

    // Statut d'un R1. Le taux de no-show ne porte que sur les R1 dont la réunion a déjà eu lieu :
    // tant que la date n'est pas passée, le R1 reste « à venir », même s'il est déjà marqué annulé
    // (prospect qui annule à l'avance) ; il pèse comme absence à sa date. Le décalé reste décalé
    // quelle que soit la date (hors taux dans tous les cas). Date passée sans résultat (SCHEDULED
    // ou vide) : « à renseigner ».
    function setterMeetingStatus(meeting, nowMs) {
      const outcome = String(meeting?.outcome || "").trim().toUpperCase();
      if (outcome === "RESCHEDULED") return "rescheduled";
      const start = toDate(meeting?.startTime);
      if (start && start.getTime() > nowMs) return "upcoming";
      if (outcome === "COMPLETED") return "done";
      if (outcome === "NO_SHOW") return "noShow";
      if (isCanceledOutcome(outcome)) return "canceled";
      return "pending";
    }

    // Atteinte en % entier, calculée en entiers : 29 / 25 = 116 %, pas 115 % (1,16 × 100 en flottant).
    function setterAttainmentPct(row) {
      return row.hasObjective ? Math.floor((row.rdv * 100) / row.target) : null;
    }

    // Paliers du mois avec le nombre de RDV minimum (ex. objectif 25 → 15 / 19 / 25 / 30).
    function setterPaliers(config, target) {
      return (config.paliers || []).slice().sort((a, b) => a.pct - b.pct).map((p, i) => ({
        ...SETTER_TIER_STYLE[Math.min(i, SETTER_TIER_STYLE.length - 1)],
        ...p,
        min: Math.ceil((target * p.pct) / 100),
      }));
    }

    // Comparaison entière (rdv × 100 ≥ objectif × %) : pas d'arrondi flottant sur les seuils.
    function setterPalierFor(config, rdv, target) {
      if (!(target > 0)) return null;
      const reached = setterPaliers(config, target).filter(p => rdv * 100 >= target * p.pct);
      return reached.length ? reached[reached.length - 1] : null;
    }

    // Mois affichés : du premier mois setter jusqu'au mois en cours (ou au dernier objectif fixé).
    function setterMonths(config, nowMonth) {
      const objectiveKeys = Object.keys(config.objectifsRdv || {}).sort();
      const end = [nowMonth, objectiveKeys[objectiveKeys.length - 1] || ""].sort().pop();
      const months = [];
      for (let k = config.startMonth || nowMonth; k && k <= end && months.length < 36; k = shiftMonthKey(k, 1)) months.push(k);
      return months;
    }

    function computeSetter(setter, config, nowMs, json = {}) {
      const rawMeetings = Array.isArray(setter.meetings) ? setter.meetings : (json.meetings || []);
      const meetings = dedupeById(rawMeetings).map(m => ({
        ...m,
        takenKey: parisDayKey(m.createdAt || m.startTime), // jour de la prise
        status: setterMeetingStatus(m, nowMs),
      }));
      const todayKey = parisDayKey(nowMs);
      const nowMonth = todayKey.slice(0, 7);
      const months = setterMonths(config, nowMonth);
      const monthsSet = new Set(months);
      const rate = config.closingRate ?? 0.03;
      const maxPct = Math.round((config.noShowMax ?? 0.30) * 100);
      const signedDeals = dedupeById(setter.signed_deals).map(d => ({
        ...d, monthKey: parisMonthKey(d.closedate), ht: Number(d.amount || 0) / TVA,
      }));
      const generatedDeals = dedupeById(setter.generated_deals).map(d => ({
        ...d, monthKey: parisMonthKey(d.createdate),
      }));

      const rows = months.map(m => {
        const taken = meetings.filter(x => x.takenKey.slice(0, 7) === m);
        const counts = Object.fromEntries(Object.keys(SETTER_STATUS).map(k => [k, 0]));
        taken.forEach(x => { counts[x.status] += 1; });
        // « À venir » déjà marqués annulés : hors taux aujourd'hui, absences à leur date.
        const canceledAhead = taken.filter(x => x.status === "upcoming" && isCanceledOutcome(x.outcome)).length;
        const rawTarget = config.objectifsRdv?.[m];
        const target = rawTarget == null ? null : Number(rawTarget);
        const hasObjective = target != null && target > 0;
        const rdv = taken.length; // annulés et décalés compris
        const palier = hasObjective ? setterPalierFor(config, rdv, target) : null;
        // Taux de no-show : (no-show + annulés) / (effectués + no-show + annulés).
        const absences = counts.noShow + counts.canceled;
        const rateBase = counts.done + absences;
        const noShowRate = rateBase > 0 ? absences / rateBase : null;
        const qualityOk = rateBase === 0 || absences * 100 <= maxPct * rateBase;
        const primePalier = palier ? palier.prime : 0;
        const primeRdv = hasObjective && qualityOk ? primePalier : 0;
        const signed = signedDeals.filter(d => d.monthKey === m);
        const signedHT = sumBy(signed, d => d.ht);
        const primeSignature = signedHT * rate; // sans autre condition (ni objectif ni no-show)
        return {
          mois: m, label: monthLabelShort(m), longLabel: monthLabelLong(m),
          isPast: m < nowMonth, isCurrent: m === nowMonth, isFuture: m > nowMonth,
          meetings: taken, rdv, target: hasObjective ? target : null, hasObjective,
          attainment: hasObjective ? rdv / target : null,
          palier, primePalier, counts, canceledAhead, absences, rateBase, noShowRate, qualityOk,
          blocked: hasObjective && !qualityOk && primePalier > 0,
          primeRdv, signed, signedHT, primeSignature,
          generated: generatedDeals.filter(d => d.monthKey === m).length,
          total: primeRdv + primeSignature,
        };
      });

      const accrued = rows.filter(r => !r.isFuture);
      return {
        meetings, rows, months, monthsSet, todayKey, nowMonth, nowMs, maxPct, rate,
        current: rows.find(r => r.isCurrent) || rows[rows.length - 1] || null,
        signedDeals, generatedDeals,
        totalRdv: sumBy(accrued, r => r.rdv),
        totalPrimeRdv: sumBy(accrued, r => r.primeRdv),
        totalSignature: sumBy(accrued, r => r.primeSignature),
        total: sumBy(accrued, r => r.total),
      };
    }

    // Indicateurs d'activité (semaines du lundi au dimanche, Europe/Paris).
    function computeSetterActivity(setter, stats) {
      const { todayKey, meetings } = stats;
      const curMon = mondayKey(todayKey);
      const prevMon = addDaysKey(curMon, -7);
      const inWeek = (key, mon) => !!key && key >= mon && key <= addDaysKey(mon, 6);
      const callsByDay = setter.calls_by_day && typeof setter.calls_by_day === "object" ? setter.calls_by_day : null;
      // connected = null quand le serveur n'a pas pu lire les dispositions d'appel : nombre inconnu,
      // on le garde tel quel (affiché « – »), surtout pas un faux 0. Jour absent = aucun appel.
      const callAt = (key) => {
        const c = callsByDay?.[key];
        if (!c) return { total: 0, connected: 0 };
        return { total: Number(c.total || 0), connected: c.connected == null ? null : (Number(c.connected) || 0) };
      };
      const sumConnected = (list, pick) => list.some(d => pick(d).connected == null) ? null : sumBy(list, d => pick(d).connected);
      // Jours ouvrés seulement (lundi → vendredi), semaine en cours face à la précédente.
      const days = [0, 1, 2, 3, 4].map(i => {
        const key = addDaysKey(curMon, i);
        const prevKey = addDaysKey(prevMon, i);
        return { key, prevKey, cur: callAt(key), prev: callAt(prevKey), future: key > todayKey, today: key === todayKey };
      });
      const elapsed = days.filter(d => !d.future);
      const tasks = setter.overdue_tasks && typeof setter.overdue_tasks === "object" ? setter.overdue_tasks : null;
      const taskItems = (Array.isArray(tasks?.items) ? tasks.items : []).slice()
        .sort((a, b) => timeOf(a.dueDate) - timeOf(b.dueDate)); // les plus anciennes d'abord
      return {
        curMon, prevMon, curEnd: addDaysKey(curMon, 6), prevEnd: addDaysKey(prevMon, 6),
        r1Cur: meetings.filter(m => inWeek(m.takenKey, curMon)).length,
        r1Prev: meetings.filter(m => inWeek(m.takenKey, prevMon)).length,
        hasCalls: !!callsByDay,
        days,
        elapsedDays: elapsed.length,
        curTotal: sumBy(elapsed, d => d.cur.total),
        curConnected: sumConnected(elapsed, d => d.cur),
        prevTotal: sumBy(days, d => d.prev.total),
        prevConnected: sumConnected(days, d => d.prev),
        hasTasks: !!tasks,
        overdueCount: Number(tasks?.count ?? taskItems.length) || 0,
        overdueItems: taskItems,
      };
    }

    function dealStageInfo(stage) {
      const s = String(stage || "").toLowerCase();
      if (s === "closedwon") return { label: "Signé", cls: "ok" };
      if (s === "closedlost") return { label: "Perdu", cls: "zero" };
      return { label: "En cours", cls: "info" };
    }

    function deltaPill(diff, suffix) {
      if (diff > 0) return `<span class="st-delta up">▲ +${fmtNum(diff)} ${suffix}</span>`;
      if (diff < 0) return `<span class="st-delta down">▼ −${fmtNum(Math.abs(diff))} ${suffix}</span>`;
      return `<span class="st-delta flat">= ${suffix}</span>`;
    }

    // ── Rendu : KPIs du mois ──────────────────────────────────────────────────
    function renderSetterKpis(config, stats) {
      const r = stats.current;
      const paliers = r.hasObjective ? setterPaliers(config, r.target) : [];
      const next = paliers.find(p => r.rdv < p.min) || null;
      const nextKpi = !r.hasObjective
        ? `<div class="val">–</div><div class="sub">pas d'objectif fixé en ${esc(r.longLabel)}</div>`
        : (next
          ? `<div class="val" data-countup="${next.prime}" data-countup-format="prime">${fmtPrime(0)}</div><div class="sub">palier ${next.pct} % à ${fmtNum(next.min)} RDV · plus que <strong>${plural(next.min - r.rdv, "RDV", "RDV")}</strong>${r.qualityOk ? "" : ` · versée si no-show ≤ ${stats.maxPct} %`}</div>`
          : `<div class="val" data-countup="${paliers[paliers.length - 1]?.prime || 0}" data-countup-format="prime">${fmtPrime(0)}</div><div class="sub">💎 palier max ${paliers[paliers.length - 1]?.pct || 120} % atteint</div>`);
      const rateKpi = r.rateBase === 0
        ? `<div class="val">–</div><div class="sub">aucun R1 au résultat saisi · seuil ${stats.maxPct} %</div>`
        : `<div class="val" data-countup="${r.noShowRate}" data-countup-format="pct">${fmtPct(0)}</div><div class="sub">seuil ${stats.maxPct} % · ${r.qualityOk ? "✓ prime RDV versée" : "✗ prime RDV à 0"}${r.counts.pending ? ` · ${plural(r.counts.pending, "à renseigner", "à renseigner")}` : ""}</div>`;
      return `
        <div class="kpis">
          <div class="kpi glass indigo reveal" style="animation-delay:.05s">
            <span class="accent"></span><span class="glow"></span>
            <div class="lbl"><span class="dot"></span>Prime ${esc(r.longLabel)}${r.isCurrent ? " à date" : ""}</div>
            <div class="val" data-countup="${r.total}" data-countup-format="prime">${fmtPrime(0)}</div>
            <div class="sub">${r.hasObjective ? (r.blocked ? "prime RDV bloquée (no-show)" : `${fmtPrime(r.primeRdv)} RDV`) : "pas de prime RDV (sans objectif)"} + ${fmtPrime(r.primeSignature)} signatures</div>
          </div>
          <div class="kpi glass emerald reveal" style="animation-delay:.13s">
            <span class="accent"></span><span class="glow"></span>
            <div class="lbl"><span class="dot"></span>Prochain palier RDV</div>
            ${nextKpi}
          </div>
          <div class="kpi glass amber reveal" style="animation-delay:.21s">
            <span class="accent"></span><span class="glow"></span>
            <div class="lbl"><span class="dot"></span>Taux de no-show ${esc(r.label)}</div>
            ${rateKpi}
          </div>
          <div class="kpi glass violet reveal" style="animation-delay:.29s">
            <span class="accent"></span><span class="glow"></span>
            <div class="lbl"><span class="dot"></span>Prime cumulée</div>
            <div class="val" data-countup="${stats.total}" data-countup-format="prime">${fmtPrime(0)}</div>
            <div class="sub">depuis ${esc(monthLabelLong(stats.months[0] || stats.nowMonth))} · ${fmtPrime(stats.totalPrimeRdv)} RDV + ${fmtPrime(stats.totalSignature)} signatures</div>
          </div>
        </div>`;
    }

    // ── Rendu : mois en cours (RDV pris + qualité) ────────────────────────────
    function renderSetterObjectiveBlock(config, row, stats) {
      const target = row.target;
      const paliers = setterPaliers(config, target);
      const current = row.palier;
      const next = paliers.find(p => row.rdv < p.min) || null;
      const pctFloor = setterAttainmentPct(row); // 59,5 % ne doit pas s'afficher 60 %
      const fillPct = Math.min(100, (row.attainment * 100 / SETTER_GAUGE_MAX_PCT) * 100);
      const notches = paliers.map(p =>
        `<div class="tier-notch" style="left:${(p.pct / SETTER_GAUGE_MAX_PCT * 100).toFixed(2)}%"><div class="tier-notch-lbl">${p.pct} %</div></div>`
      ).join("");

      const tiersHtml = paliers.map(p => {
        const done = row.rdv >= p.min;
        const isCurrent = done && current?.pct === p.pct;
        const isNext = !done && next?.pct === p.pct;
        const detail = isCurrent
          ? (row.qualityOk ? (row.isCurrent ? "Prime acquise à date" : "Prime du mois") : "Bloquée : no-show")
          : (done ? "Palier atteint" : (isNext ? `Plus que ${plural(p.min - row.rdv, "RDV", "RDV")}` : "À débloquer"));
        const stateLabel = done ? (isCurrent ? "✓ Actuel" : "✓ Atteint") : "✓ Atteint";
        return `<div class="tier ${p.key} ${done ? "unlocked" : "locked"} ${isCurrent ? "current" : ""} ${isNext ? "next" : ""}">
          <span class="tier-state ${done ? "unlocked" : "locked"}"${done ? "" : ' aria-hidden="true"'}>${stateLabel}</span>
          <span class="emoji">${p.emoji}</span>
          <div class="name">Palier ${p.pct} %</div>
          <div class="seuil">≥ ${fmtNum(p.min)} RDV</div>
          <div class="prime">${fmtPrime(p.prime)}</div>
          <div class="tier-detail">${esc(detail)}</div>
        </div>`;
      }).join("");

      // Rythme : RDV pris par jour ouvré écoulé, projeté sur le mois (indicatif).
      let pace = "";
      if (row.isCurrent) {
        const monthStart = `${row.mois}-01`;
        const monthEnd = lastDayOfMonthKey(row.mois);
        const elapsed = workdaysBetween(monthStart, stats.todayKey);
        const totalDays = workdaysBetween(monthStart, monthEnd);
        const left = Math.max(0, totalDays - elapsed);
        if (elapsed >= 3 && totalDays > 0) {
          const projected = Math.round((row.rdv / elapsed) * totalDays);
          pace = `Au rythme actuel : ≈ <strong>${plural(projected, "RDV", "RDV")}</strong> fin ${esc(row.label.toLowerCase())} · ${plural(left, "jour ouvré restant", "jours ouvrés restants")}`;
        } else {
          pace = `${plural(left, "jour ouvré restant", "jours ouvrés restants")} ce mois-ci`;
        }
      }

      const subLeft = row.qualityOk
        ? `Prime RDV ${esc(row.longLabel)}${row.isCurrent ? " à date" : ""} : <strong>${fmtPrime(row.primeRdv)}</strong>${current ? ` · ${current.emoji} palier ${current.pct} %` : " · aucun palier"}`
        : `Prime RDV bloquée : no-show <strong>${fmtPct(row.noShowRate)}</strong> &gt; ${stats.maxPct} %${current ? ` (palier ${fmtPrime(current.prime)} suspendu)` : ""}`;
      const subRight = next
        ? `Prochaine : ${next.emoji} <strong>${fmtPrime(next.prime)}</strong> à ${fmtNum(next.min)} RDV · plus que <strong>${plural(next.min - row.rdv, "RDV", "RDV")}</strong>`
        : `💎 Palier max atteint`;

      return `
        <div class="st-big">
          <span class="n" data-countup="${row.rdv}" data-countup-format="num">${fmtNum(0)}</span>
          <span class="of">/ ${fmtNum(target)}</span>
          <span class="what">RDV pris <span class="pill ${pctFloor >= 100 ? "surperf" : (current ? "ok" : "zero")}">${pctFloor} % de l'objectif</span></span>
        </div>
        ${pace ? `<div class="st-pace">${pace}</div>` : ""}
        <div class="tier-track-wrap">
          <div class="tier-track">
            <div class="tier-fill" data-w="${fillPct.toFixed(2)}">
              ${current ? `<div class="head-bubble">${current.emoji}</div>` : ""}
            </div>
            ${notches}
          </div>
        </div>
        <div class="tiers">${tiersHtml}</div>
        <div class="tier-sub"><span>${subLeft}</span><span>${subRight}</span></div>`;
    }

    function renderSetterNoObjectiveBlock(row) {
      return `
        <div class="st-big">
          <span class="n" data-countup="${row.rdv}" data-countup-format="num">${fmtNum(0)}</span>
          <span class="what">RDV pris en ${esc(row.longLabel)}</span>
        </div>
        <div class="tier-sub" style="margin-top:22px">
          <span><strong>Pas d'objectif fixé</strong> pour ${esc(row.longLabel)} : pas de prime RDV ce mois-ci.</span>
          <span>Les RDV restent comptés, la prime sur signature s'applique.</span>
        </div>`;
    }

    function renderSetterPendingAlert(stats, row) {
      const pendingAll = stats.meetings.filter(m => m.status === "pending" && stats.monthsSet.has(m.takenKey.slice(0, 7)));
      if (!pendingAll.length) return "";
      const here = pendingAll.filter(m => m.takenKey.slice(0, 7) === row.mois).sort((a, b) => timeOf(a.startTime) - timeOf(b.startTime));
      const others = pendingAll.length - here.length;
      const moreOthers = others > 0 ? `<div class="more">+ ${plural(others, "R1 à renseigner", "R1 à renseigner")} sur d'autres mois</div>` : "";
      if (!here.length) {
        return `<div class="st-alert"><strong>${plural(others, "R1 passé sans résultat", "R1 passés sans résultat")}</strong> sur d'autres mois : le closer doit le saisir dans HubSpot.</div>`;
      }
      const items = here.slice(0, 5).map(m => `
        <li>
          <span class="t">${esc(m.title || "R1 sans titre")}</span>
          <span class="s">${esc(fmtParisSlot(m.startTime))} · à saisir par ${esc(closerName(m.closerOwnerId))}</span>
        </li>`).join("");
      const moreHere = here.length > 5 ? `<div class="more">+ ${fmtNum(here.length - 5)} autre${here.length - 5 > 1 ? "s" : ""} en ${esc(row.longLabel)}</div>` : "";
      return `
        <div class="st-alert">
          <strong>${plural(here.length, "R1 passé sans résultat", "R1 passés sans résultat")}</strong> : le closer doit saisir le résultat dans HubSpot (effectué, no-show, annulé ou décalé). Taux provisoire d'ici là.
          <ul>${items}</ul>
          ${moreHere}${moreOthers}
        </div>`;
    }

    function renderSetterQuality(row, stats) {
      const c = row.counts;
      const empty = row.rateBase === 0;
      const cls = empty ? "empty" : (row.qualityOk ? "ok" : "ko");
      const state = empty
        ? `<span class="pill zero">en attente de résultats</span>`
        : (row.qualityOk
          ? `<span class="pill ok">✓ ≤ ${stats.maxPct} % · prime RDV versée</span>`
          : `<span class="pill ko">✗ &gt; ${stats.maxPct} % · prime RDV à 0</span>`);
      const fill = empty ? 0 : Math.min(100, row.noShowRate * 100);
      const ahead = row.canceledAhead
        ? ` Dont ${plural(row.canceledAhead, "R1 à venir déjà annulé, qui comptera comme absence à sa date", "R1 à venir déjà annulés, qui compteront comme absences à leur date")}.`
        : "";
      const note = empty
        ? `Aucun R1 de ce mois n'a encore eu lieu avec un résultat saisi (effectué, no-show ou annulé).${ahead}`
        : `Taux de show <strong>${fmtPct(c.done / row.rateBase)}</strong> · (${plural(c.noShow, "no-show", "no-show")} + ${plural(c.canceled, "annulé", "annulés")}) / <strong>${plural(row.rateBase, "R1", "R1")}</strong> passés au résultat saisi. Décalés, à renseigner et à venir restent hors taux.${ahead}`;
      const chip = (key, extra = "") => `
        <div class="st-count ${key} ${SETTER_STATUS[key].inRate ? "" : "out"} ${extra}">
          <div class="n">${fmtNum(c[key])}</div>
          <div class="l">${esc(SETTER_STATUS[key].label)}</div>
        </div>`;
      return `
        <div class="st-quality ${cls}">
          <div class="st-q-head"><span class="metric-eyebrow">Taux de no-show · ${esc(row.label)}</span>${state}</div>
          <div class="st-q-rate">${empty ? "–" : fmtPct(row.noShowRate)}</div>
          <div class="st-q-note">${note}</div>
          <div class="st-rate-gauge">
            <div class="st-rate-fill" data-w="${fill.toFixed(1)}"></div>
            <div class="st-rate-mark" style="left:${stats.maxPct}%"><span>seuil ${stats.maxPct} %</span></div>
          </div>
          <div class="st-counts">
            <div class="st-counts-cap">Dans le taux</div>
            ${chip("done")}${chip("noShow")}${chip("canceled")}
            <div class="st-counts-cap">Hors taux</div>
            ${chip("rescheduled")}${chip("pending", c.pending > 0 ? "has" : "")}${chip("upcoming")}
          </div>
          ${renderSetterPendingAlert(stats, row)}
        </div>`;
    }

    function renderSetterMonthCard(config, row, stats) {
      return `
        <div class="glass reveal" style="animation-delay:.34s">
          <div class="card-head">
            <h3><span class="head-ico">📅</span>${esc(capFirst(row.longLabel))} · RDV pris</h3>
            <span class="meta">comptés le jour de la prise · annulés et décalés compris${row.hasObjective ? ` · objectif <strong>${fmtNum(row.target)}</strong>` : ""}</span>

    // Barres « semaine en cours » posées dans le fantôme pointillé de la semaine précédente
    // (même logique visuelle que objectif / réalisé dans les graphes mensuels).
    function renderCallsChart(days) {
      const W = 320, H = 158, PL = 4, PR = 4, PT = 16, PB = 34;
      const innerW = W - PL - PR, innerH = H - PT - PB;
      const max = Math.max(1, ...days.flatMap(d => [d.future ? 0 : d.cur.total, d.prev.total]));
      const yMax = max * 1.12;
      const colW = innerW / days.length;
      const ghostW = Math.min(42, colW * 0.68);
      const barW = ghostW * 0.56;
      const baseY = PT + innerH;
      let marks = "";
      // Connectés inconnus (null) : ni barre foncée ni « N connectés » dans l'infobulle.
      const callsTitle = (c) => `${c.total} appels${c.connected == null ? "" : `, ${c.connected} connectés`}`;
      days.forEach((d, i) => {
        const cx = PL + colW * i + colW / 2;
        const hPrev = (d.prev.total / yMax) * innerH;
        if (hPrev > 0) {
          marks += `<rect class="ghost" x="${(cx - ghostW / 2).toFixed(1)}" y="${(baseY - hPrev).toFixed(1)}" width="${ghostW.toFixed(1)}" height="${hPrev.toFixed(1)}" rx="6"><title>${esc(fmtDayKey(d.prevKey, FMT_DAY_LABEL))} : ${callsTitle(d.prev)}</title></rect>`;
        }
        if (!d.future) {
          const hCur = (d.cur.total / yMax) * innerH;
          const hConn = d.cur.connected == null ? 0 : Math.min(hCur, (d.cur.connected / yMax) * innerH);
          const delay = (0.2 + i * 0.06).toFixed(2);
          if (hCur > 0) {
            marks += `<rect class="cur" x="${(cx - barW / 2).toFixed(1)}" y="${(baseY - hCur).toFixed(1)}" width="${barW.toFixed(1)}" height="${hCur.toFixed(1)}" rx="5" fill="url(#st-calls-grad)" style="animation-delay:${delay}s"><title>${esc(fmtDayKey(d.key, FMT_DAY_LABEL))} : ${callsTitle(d.cur)}</title></rect>`;
          }
          if (hConn > 0) {
            marks += `<rect class="conn" x="${(cx - barW / 2).toFixed(1)}" y="${(baseY - hConn).toFixed(1)}" width="${barW.toFixed(1)}" height="${hConn.toFixed(1)}" rx="5" style="animation-delay:${delay}s"/>`;
          }
          marks += `<text class="v" x="${cx.toFixed(1)}" y="${(baseY - hCur - 5).toFixed(1)}">${fmtNum(d.cur.total)}</text>`;
        }
        marks += `<text class="day ${d.today ? "today" : (d.future ? "future" : "")}" x="${cx.toFixed(1)}" y="${baseY + 14}">${esc(fmtDayKey(d.key, FMT_DAY_LABEL))}</text>`;
        marks += `<text class="prev-v" x="${cx.toFixed(1)}" y="${baseY + 27}">s-1 : ${fmtNum(d.prev.total)}</text>`;
      });
      return `
        <svg class="calls-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Appels par jour ouvré, semaine en cours et semaine précédente">
          <defs>
            <linearGradient id="st-calls-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#a5b4fc"/>
              <stop offset="60%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#4f46e5"/>
            </linearGradient>
          </defs>
          <line class="base" x1="${PL}" y1="${baseY}" x2="${W - PR}" y2="${baseY}"/>
          ${marks}
        </svg>`;
    }

    function renderSetterCallsCard(act) {
      const head = (meta) => `
        <div class="card-head">
          <h3><span class="head-ico">📞</span>Appels par jour</h3>
          <span class="meta">${meta}</span>
        </div>`;
      if (!act.hasCalls) {
        return `<div class="glass st-ind reveal" style="animation-delay:.48s">${head("jours ouvrés")}<div class="card-body"><div class="st-empty">Appels indisponibles pour le moment.</div></div></div>`;
      }
      const avgCur = act.elapsedDays ? act.curTotal / act.elapsedDays : 0;
      const avgPrev = act.prevTotal / 5;
      const connectedKnown = act.curConnected != null;
      const connectedPct = act.curTotal && connectedKnown ? act.curConnected / act.curTotal : null;
      return `
        <div class="glass st-ind reveal" style="animation-delay:.48s">
          ${head(`<strong>${fmtNum(act.curTotal)}</strong> cette semaine · ${fmtNum(act.prevTotal)} la précédente`)}
          <div class="card-body">
            <div class="st-ind-row">
              <span class="st-ind-val" data-countup="${Math.round(avgCur)}" data-countup-format="num">${fmtNum(0)}</span>
              <span class="st-ind-unit">appels / jour</span>
              ${deltaPill(Math.round(avgCur) - Math.round(avgPrev), "vs sem. dernière")}
            </div>
            <div class="st-ind-sub">moyenne sur ${plural(act.elapsedDays, "jour ouvré", "jours ouvrés")} · <strong>${fmtNum(act.curConnected)}</strong> connectés${connectedPct == null ? "" : ` (${fmtPct(connectedPct)})`}</div>
            ${act.curTotal + act.prevTotal === 0
              ? `<div class="st-empty">Aucun appel enregistré sur ces deux semaines.</div>`
              : `${renderCallsChart(act.days)}
            <div class="st-legend legend">
              <span class="legend-item"><span class="legend-dot" style="background:linear-gradient(180deg,#a5b4fc,#4f46e5)"></span>Cette semaine</span>
              ${connectedKnown ? `<span class="legend-item"><span class="legend-dot" style="background:#312e81; opacity:.55"></span>dont connectés</span>` : ""}
              <span class="legend-item"><span class="legend-dot" style="background:rgba(148,163,184,0.14); border:1px dashed rgba(148,163,184,0.7)"></span>Semaine dernière</span>
            </div>`}
          </div>
        </div>`;
    }

    function renderSetterDealsCard(stats) {
      const deals = stats.generatedDeals.slice().sort((a, b) => timeOf(b.createdate) - timeOf(a.createdate));
      const r = stats.current;
      const openTTC = sumBy(deals.filter(d => !["closedwon", "closedlost"].includes(String(d.stage || "").toLowerCase())), d => d.amount);
      const items = deals.slice(0, 3).map(d => {
        const stage = dealStageInfo(d.stage);
        return `
          <li>
            <span class="t">${esc(d.name || "Deal sans nom")}</span>
            <span class="s">créé le ${esc(fmtParisDate(d.createdate))} · ${fmtEur(d.amount)} TTC</span>
            <span class="r"><span class="pill ${stage.cls}">${stage.label}</span></span>
          </li>`;
      }).join("");
      return `
        <div class="glass st-ind reveal" style="animation-delay:.54s">
          <div class="card-head">
            <h3><span class="head-ico">🧾</span>Transactions générées</h3>
            <span class="meta">après un R1</span>
          </div>
          <div class="card-body">
            <div class="st-ind-row">
              <span class="st-ind-val" data-countup="${r.generated}" data-countup-format="num">${fmtNum(0)}</span>
              <span class="st-ind-unit">en ${esc(r.label.toLowerCase())}</span>
            </div>
            <div class="st-ind-sub"><strong>${fmtNum(deals.length)}</strong> depuis ${esc(monthLabelLong(stats.months[0] || stats.nowMonth))} · ${plural(stats.signedDeals.length, "signée", "signées")} · ${fmtEur(openTTC)} TTC encore en cours</div>
            ${deals.length ? `<ul class="st-list">${items}</ul>` : `<div class="st-empty">Pas encore de deal créé sur une société de tes R1.</div>`}
          </div>
        </div>`;
    }

    function renderSetterTasksCard(act, stats) {
      const head = `
        <div class="card-head">
          <h3><span class="head-ico">⏰</span>Tâches en retard</h3>
          <span class="meta">échéance passée, non terminées</span>
        </div>`;
      if (!act.hasTasks) {
        return `<div class="glass st-ind reveal" style="animation-delay:.60s">${head}<div class="card-body"><div class="st-empty">Tâches indisponibles pour le moment.</div></div></div>`;
      }
      const todayUtc = dayKeyUtc(stats.todayKey);
      const item = (t) => {
        const dueKey = parisDayKey(t.dueDate);
        const late = dueKey ? Math.max(0, Math.round((todayUtc - dayKeyUtc(dueKey)) / 86400000)) : null;
        return `
          <li>
            <span class="t">${esc(t.subject || "Tâche sans titre")}</span>
            <span class="s">${esc(t.companyName || "sans société")} · échéance ${esc(fmtParisDate(t.dueDate))}</span>
            <span class="r"><span class="pill ko">${late == null ? "en retard" : (late === 0 ? "aujourd'hui" : `${fmtNum(late)} j`)}</span></span>
          </li>`;
      };
      const shown = act.overdueItems.slice(0, 4);
      const rest = act.overdueItems.slice(4);
      const beyond = Math.max(0, act.overdueCount - act.overdueItems.length);
      return `
        <div class="glass st-ind reveal" style="animation-delay:.60s">
          ${head}
          <div class="card-body">
            <div class="st-ind-row">
              <span class="st-ind-val ${act.overdueCount > 0 ? "alert" : ""}" data-countup="${act.overdueCount}" data-countup-format="num">${fmtNum(0)}</span>
              <span class="st-ind-unit">${act.overdueCount > 1 ? "tâches en retard" : "tâche en retard"}</span>
            </div>
            ${act.overdueCount === 0
              ? `<div class="st-empty">Aucune tâche en retard 👏</div>`
              : `<ul class="st-list">${shown.map(item).join("")}</ul>
                 ${rest.length ? `<details><summary>Voir ${plural(rest.length, "autre tâche", "autres tâches")}</summary><ul class="st-list">${rest.map(item).join("")}</ul></details>` : ""}
                 ${beyond ? `<div class="st-ind-sub">+ ${plural(beyond, "autre tâche", "autres tâches")} dans HubSpot</div>` : ""}`}
          </div>
        </div>`;
    }

    // ── Rendu : prime sur signature ───────────────────────────────────────────
    function renderSetterSignatureCard(config, stats) {
      const rate = stats.rate;
      const meetingsById = new Map(stats.meetings.map(m => [String(m.id), m]));
      // Date qui sert à la règle côté serveur (r1AnchorMs) : la PRISE du R1, pas la réunion.
      // Un deal signé entre la prise et la réunion est légitime ; afficher la date de réunion
      // le ferait passer pour « signé avant le R1 ».
      const r1Date = (d) => {
        const m = meetingsById.get(String(d.fromMeetingId ?? ""));
        return m ? fmtParisDate(m.createdAt || m.startTime) : "–";
      };
      const signed = stats.signedDeals.filter(d => stats.monthsSet.has(d.monthKey))
        .sort((a, b) => timeOf(b.closedate) - timeOf(a.closedate));
      const generated = stats.generatedDeals.slice().sort((a, b) => timeOf(b.createdate) - timeOf(a.createdate));
      const cur = stats.current;
      const signedRows = signed.map(d => `
        <tr>
          <td class="deal-name"><strong>${esc(d.name || "Deal sans nom")}</strong></td>
          <td class="num">${esc(r1Date(d))}</td>
          <td class="num">${esc(fmtParisDate(d.closedate))}</td>
          <td class="num">${fmtEur(d.amount)}</td>
          <td class="num">${fmtEur(d.ht)}</td>
          <td class="num"><strong>${fmtPrime(d.ht * rate)}</strong></td>
        </tr>`).join("");
      const generatedRows = generated.map(d => {
        const stage = dealStageInfo(d.stage);
        return `
          <tr>
            <td class="deal-name"><strong>${esc(d.name || "Deal sans nom")}</strong></td>
            <td class="num">${esc(r1Date(d))}</td>
            <td class="num">${esc(fmtParisDate(d.createdate))}</td>
            <td class="num"><span class="pill ${stage.cls}">${stage.label}</span></td>
            <td class="num">${fmtEur(d.amount)}</td>
            <td class="num">${d.closedate ? esc(fmtParisDate(d.closedate)) : "–"}</td>
          </tr>`;
      }).join("");
      const colgroup = `<colgroup><col style="width:34%" /><col /><col /><col /><col /><col /></colgroup>`;
      return `
        <div class="glass reveal" style="animation-delay:.66s">
          <div class="card-head">
            <h3><span class="head-ico">✍️</span>Prime sur signature · ${Math.round(rate * 100)} % HT</h3>
            <span class="meta">signés après un R1 sur la même société · <strong>${fmtPrime(cur.primeSignature)}</strong> en ${esc(cur.label.toLowerCase())} · ${fmtPrime(stats.totalSignature)} au total</span>
          </div>
          <div class="card-body" style="padding:0">
            ${signed.length ? `
              <div class="table-wrap">
                <table>
                  ${colgroup}
                  <thead>
                    <tr>
                      <th>Deal signé</th>
                      <th class="num">R1 pris le</th>
                      <th class="num">Signé le</th>
                      <th class="num">Montant TTC</th>
                      <th class="num">Montant HT</th>
                      <th class="num">Prime ${Math.round(rate * 100)} %</th>
                    </tr>
                  </thead>
                  <tbody>${signedRows}</tbody>
                </table>
              </div>`
            : `<div class="card-body"><div class="st-empty" style="margin-top:0">Aucune signature pour l'instant sur tes R1. Dès qu'un AE signe un deal sur une société où tu as posé un R1 (après ce R1), ${Math.round(rate * 100)} % du HT s'ajoute ici.</div></div>`}
            ${generated.length ? `
              <details style="margin:0; padding:12px 18px 14px; border-top:1px solid rgba(226,232,240,0.7)">

    // ── Confetti ──────────────────────────────────────────────────────────────
    function confetti({ burst = 1 } = {}) {
      const cvs = document.getElementById("confetti");
      const ctx = cvs.getContext("2d");
      function resize() { cvs.width = innerWidth; cvs.height = innerHeight; }
      resize(); addEventListener("resize", resize);

      const colors = ["#6366f1","#10b981","#f59e0b","#f43f5e","#8b5cf6","#06b6d4","#eab308"];
      const parts = [];
      const bursts = Math.min(burst, 4);
      for (let b = 0; b < bursts; b++) {
        setTimeout(() => {
          for (let i = 0; i < 130; i++) {
            parts.push({
              x: innerWidth * (0.3 + Math.random() * 0.4),
              y: innerHeight * 0.2,
              vx: (Math.random() - 0.5) * 13,
              vy: -Math.random() * 14 - 4,
              g:  0.35 + Math.random() * 0.15,
              size: 5 + Math.random() * 4,
              rot: Math.random() * Math.PI * 2,
              vr:  (Math.random() - 0.5) * 0.35,
              color: colors[(Math.random() * colors.length) | 0],
              life: 150 + Math.random() * 40,
            });
          }
        }, b * 350);
      }
      (function loop() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i];
          p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
          if (p.life <= 0 || p.y > cvs.height + 20) { parts.splice(i, 1); continue; }
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.5);
          ctx.restore();
        }
        if (parts.length > 0) requestAnimationFrame(loop);
        else ctx.clearRect(0, 0, cvs.width, cvs.height);
      })();
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    (async () => {
      const config = CONFIG[OWNER];
      if (!config) { renderError(`Aucune fiche de prime configurée pour l'owner ${OWNER || "(manquant)"}.`); return; }
      if (!TOKEN)  { renderError("Token d'accès manquant dans l'URL."); return; }

      try {
        const res  = await fetch(`${API}?owner_id=${encodeURIComponent(OWNER)}&mode=${encodeURIComponent(config.type || "ae")}`, {
          headers: { Authorization: `Bearer ${TOKEN}` },
        });
        // 403 : le lien personnel ne couvre pas cet owner (ou ce mode). On n'en dit pas plus.
        if (res.status === 403) { renderAccessDenied(); return; }
        const json = await res.json().catch(() => ({}));
        if (res.status === 401) throw new Error(ACCESS_INVALID_MSG);
        if (!res.ok || !json.ok) throw new Error(json.error || `HTTP ${res.status}`);

        if (config.type === "setter") { renderSetterDashboard(config, json); return; }

        const sourceMonthly  = config.type === "teamLead" ? monthlyFromTeamAgg(json.team_monthly) : undefined;
        // Pour Camille on isole ses propres signatures parmi les deals équipe afin d'évaluer
        // la sur-performance perso (distincte de la sur-performance équipe). On filtre par owner_id.
        const persoMonthly   = config.type === "teamLead"
          ? monthlyFromDeals((json.deals || []).filter(d => String(d.owner_id || "") === String(OWNER)))
          : undefined;
        const stats          = config.type === "rdv"
          ? computeRdv(json.meetings || [], json.opened_deals || [], json.deals || [], config)
          : compute(json.deals || [], config, { byMonth: sourceMonthly, byMonthPerso: persoMonthly });
        // Pour Hugo : 5% HT sur les deals où ils ont pris le RDV mais qu'un autre a signé.
        const kickback       = config.type === "ae"
          ? computeKickback(json.kickback_deals || [], 0.05)
          : { byMonth: {}, totalHT: 0, totalCount: 0, totalCommission: 0, rate: 0.05 };
        if (config.type === "ae" && kickback.totalCommission > 0) {
          stats.kickback = kickback;
          stats.commTotal += kickback.totalCommission;
        } else if (config.type === "ae") {
          stats.kickback = kickback;
        }
        const projection     = config.type === "rdv"
          ? buildRdvProjection(config, stats, json.pipeline_deals || [])
          : buildSalesProjection(config, stats, json.pipeline_deals || []);
        const teamTotalTTC   = json.team_total_amount ?? json.team_total_ttc ?? json.team_total ?? 0;
        const teamHT         = teamTotalTTC / TVA;
        const teamDealsCount = json.team_deals_count || 0;
        const quartersByKey  = computeQuartersHT(json.team_monthly || {});
        const currentKey     = currentQuarterKey();
        const teamContext    = {
          quartersByKey,
          activeKey: currentKey,
          currentKey,
          teamHT,
          teamTotalTTC,
          teamDealsCount,
        };
        if (config.type === "rdv") renderRdvDashboard(config, stats, projection, teamContext, json);
        else renderDashboard(config, stats, projection, teamContext, json);
      } catch (e) {
        renderError(e.message || String(e));
      }
    })();
  </script>
</body>
</html>
